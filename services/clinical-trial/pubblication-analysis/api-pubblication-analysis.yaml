openapi: 3.0.3
info:
  title: Analysis and Pubblication Management API
  description: API per gestire l'analisi dei dati delle pubblicazioni e le pubblicazioni stesse di studi clinici tra ospedali, dal punto di vista degli Initiator Hospital
  version: 1.0.0
servers:
  - url: https://api.analysis-pubblication.example/v1
    description: Server principale
security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    AnalysisRequest:
      type: object
      properties:
        trialId:
          type: string
          format: uuid
          description: ID del protocollo/trial di riferimento
        title:
          type: string
          description: Titolo dello studio
        description:
          type: string
          description: Descrizione dello studio
        experiment:
          type: array
          items:
            type: string
            format: uuid
          description: Array degli esperimenti da analizzare
        # dataFormat:
        #   type: string
        #   enum: [JSON, CSV, XML]
        #   description: Formato dei dati da analizzare
        analysisType:
          type: string
          enum: [STATISTICAL, COMPARATIVE, CORRELATIONAL, META_ANALYSIS]
          description: Tipo di analisi richiesta
        # parameters:
        #   type: object
        #   description: Parametri opzionali specifici per il tipo di analisi
      required:
        - trialId
        - title
        - experiment
        - analysisType

    Analysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trialId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [QUEUED, IN_PROGRESS, COMPLETED, FAILED]
        # startedAt:
        #   type: string
        #   format: date-time
        # completedAt:
        #   type: string
        #   format: date-time
        result:
          type: string
          enum: [SCIENTIFICALLY_RELEVANT, INCONCLUSIVE, NEEDS_FURTHER_RESEARCH]
        # confidence:
        #   type: number
        #   format: float
        #   description: Livello di confidenza statistica (0-1)
        summary:
          type: string
          description: Riassunto dei risultati dell'analisi
        # charts:
        #   type: array
        #   items:
        #     type: object
        #     properties:
        #       chartType:
        #         type: string
        #         enum: [BAR, LINE, SCATTER, PIE, BOX_PLOT]
        #       title:
        #         type: string
        #       description:
        #         type: string
        #       data:
        #         type: object
        #         description: Dati per la generazione del grafico
        # dataPoints:
        #   type: array
        #   items:
        #     type: object
        #     description: Dati significativi identificati nell'analisi
      required:
        - id
        - trialId
        - title
        - status

    PublicationRequest:
      type: object
      properties:
        analysisId:
          type: string
          format: uuid
        title:
          type: string
        abstract:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              institution:
                type: string
              role:
                type: string
        keywords:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
        references:
          type: array
          items:
            type: string
        targetJournals:
          type: array
          items:
            type: string
      required:
        - analysisId
        - title
        - abstract
        - authors

    Publication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        analysisId:
          type: string
          format: uuid
        trialId:
          type: string
          format: uuid
        title:
          type: string
        abstract:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              institution:
                type: string
        keywords:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
        references:
          type: array
          items:
            type: string
        publicationDate:
          type: string
          format: date-time
        doi:
          type: string
          description: Digital Object Identifier
        journal:
          type: string
        citations:
          type: integer
          description: Numero di citazioni ricevute
        version:
          type: integer
          default: 1
      required:
        - id
        - analysisId
        - title
        - abstract
        - authors
        - status

paths:
  /analyses:
    post:
      summary: Invia la richiesta per una nuova analisi
      description: Invia una richiesta per analizzare i dati di uno o più esperimenti
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "202":
          description: Richiesta di analisi accettata
          content:
            application/json:
              schema:
                # $ref: "#/components/schemas/Analysis"
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Richiesta non valida
        "401":
          description: Non autorizzato

  /analyses/{analysisId}:
    get:
      summary: Recupera la specifica analisi
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Analisi trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Analisi non trovata
        "401":
          description: Non autorizzato

  /analyses/{analysisId}/cancel:
    post:
      summary: Annulla un'analisi in corso
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Analisi annullata
        "400":
          description: Operazione non valida
        "404":
          description: Analisi non trovata
        "401":
          description: Non autorizzato

  /publications:
    post:
      summary: Crea una nuova pubblicazione
      description: Crea una pubblicazione basata su un'analisi completata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "201":
          description: Pubblicazione creata
          content:
            application/json:
              schema:
                # $ref: "#/components/schemas/Publication"
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Richiesta non valida
        "401":
          description: Non autorizzato

  /publications/{publicationId}:
    get:
      summary: Recupera una pubblicazione specifica
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pubblicazione trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "404":
          description: Pubblicazione non trovata
        "401":
          description: Non autorizzato

    put:
      summary: Aggiorna una pubblicazione
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Publication"
      responses:
        "200":
          description: Pubblicazione aggiornata
        "400":
          description: Richiesta non valida
        "404":
          description: Pubblicazione non trovata
        "401":
          description: Non autorizzato

