  #               $ref: "#/components/schemas/Error"
  #       "401":
  #         description: Non autorizzato
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/Error"

  # # ! dal punto di vista del collaborator
  # /protocols/{protocolId}/modifications:
  #   post:
  #     summary: Propone modifiche a un protocollo
  #     description: L'ospedale collaboratore propone modifiche al protocollo
  #     parameters:
  #       - name: protocolId
  #         in: path
  #         required: true
  #         schema:
  #           type: string
  #           format: uuid
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             $ref: "#/components/schemas/Modification"
  #     responses:
  #       "201":
  #         description: Modifica proposta registrata
  #       "400":
  #         description: Dati non validi
  #       "404":
  #         description: Protocollo non trovato
  #       "401":
  #         description: Non autorizzato

  #   get:
  #     summary: Recupera le modifiche proposte per un protocollo
  #     parameters:
  #       - name: protocolId
  #         in: path
  #         required: true
  #         schema:
  #           type: string
  #           format: uuid
  #       - name: status
  #         in: query
  #         schema:
  #           type: string
  #           enum: [SUBMITTED, APPROVED, REJECTED]
  #     responses:
  #       "200":
  #         description: Lista delle modifiche proposte
  #         content:
  #           application/json:
  #             schema:
  #               type: array
  #               items:
  #                 $ref: "#/components/schemas/Modification"
  #       "404":
  #         description: Protocollo non trovato
  #       "401":
  #         description: Non autorizzato

  /modifications/{modificationId}/evaluate:
    post:
      summary: Valuta una modifica proposta
      description: Il CRD valuta una modifica proposta da un ospedale collaboratore
      parameters:
        - name: modificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                comments:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Valutazione della modifica registrata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Dati non validi
        "404":
          description: Modifica non trovata
        "401":
          description: Non autorizzato

  /protocols/{protocolId}/finalize:
    post:
      summary: Finalizza un protocollo con le modifiche approvate
      description: Il CRD finalizza il protocollo integrando le modifiche approvate
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: objectives
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: methodology
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Protocollo finalizzato
        "400":
          description: Operazione non valida
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

  /protocols/{protocolId}/cancel:
    post:
      summary: Annulla uno studio
      description: Il CRD annulla lo studio per insufficiente numero di ospedali aderenti
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Studio annullato
        "400":
          description: Operazione non valida
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato
