openapi: 3.0.3
info:
  title: Clinical Trial Management API
  description: API per gestire protocolli e inviti di studi clinici tra ospedali, dal punto di vista degli Initiator Hospital
  version: 1.0.0
servers:
  - url: https://api.clinical-trial-mangement.example/v1
    description: Server principale
security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Protocol:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        objectives:
          type: string
        methodology:
          type: string
        minParticipants:
          type: integer
        status:
          type: string
          enum:
            [
              DRAFT,
              SUBMITTED,
              APPROVED,
              REJECTED,
              NEEDS_MODIFICATION,
              CANCELLED,
              ACTIVE,
              COMPLETED,
            ]
        # createdAt:
        #   type: string
        #   format: date-time
        # updatedAt:
        #   type: string
        #   format: date-time
      required:
        - title
        - objectives
        - methodology
        - minParticipants

    Evaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        protocolId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPROVED, REJECTED, NEEDS_MODIFICATION]
        comments:
          type: string
        # evaluatedAt:
        #   type: string
        #   format: date-time
      required:
        - protocolId
        - decision

    Hospital:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        # #? forse non serve in senso stretto
        # type:
        #   type: string
        #   enum: [INITIATOR, COLLABORATOR]
        contactEmail:
          type: string
          format: email
      required:
        - name
        - type
        - contactEmail

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        protocolId:
          type: string
          format: uuid
        hospitalId:
          type: string
          format: uuid
        status:
          type: string
          enum: [SENT, ACCEPTED, REJECTED, MODIFICATIONS_REQUESTED]
        sentAt:
          type: string
          format: date-time
        responseDeadline:
          type: string
          format: date-time
      required:
        - protocolId
        - hospitalId

    # # ! dal punto di vista del collaborator
    # Modification:
    #   type: object
    #   properties:
    #     id:
    #       type: string
    #       format: uuid
    #     protocolId:
    #       type: string
    #       format: uuid
    #     hospitalId:
    #       type: string
    #       format: uuid
    #     description:
    #       type: string
    #     status:
    #       type: string
    #       enum: [SUBMITTED, APPROVED, REJECTED]
    #     submittedAt:
    #       type: string
    #       format: date-time
    #   required:
    #     - protocolId
    #     - hospitalId
    #     - description

    Response:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, REJECTED, MODIFICATIONS_REQUESTED]
        comments:
          type: string
        submittedAt:
          type: string
          format: date-time
      required:
        - invitationId
        - status

paths:
  /protocols:
    get:
      summary: Recupera la lista dei protocolli
      description: Recupera tutti i protocolli visibili all'utente autenticato
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                DRAFT,
                SUBMITTED,
                APPROVED,
                REJECTED,
                NEEDS_MODIFICATION,
                CANCELLED,
                ACTIVE,
                COMPLETED,
              ]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista dei protocolli
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Protocol"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      pages:
                        type: integer
                      current:
                        type: integer
        "401":
          description: Non autorizzato

    post:
      summary: Crea un nuovo protocollo
      description: Il CRD (Clinical Research Group) dell'Initiatior Hospital crea un nuovo protocollo di studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Protocol"
      responses:
        "201":
          description: Protocollo creato con successo
          content:
            application/json:
              schema:
                # $ref: "#/components/schemas/Protocol"
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Dati non validi
        "401":
          description: Non autorizzato

  /protocols/{protocolId}:
    get:
      summary: Recupera un protocollo specifico
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Protocollo trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protocol"
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

  /protocols/{protocolId}/submit:
    post:
      summary: Invia un protocollo per valutazione
      description: Il CRD (Clinical Research Group) invia il protocollo al EC (Ethical Committee) per valutazione
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Protocollo inviato per valutazione
        "400":
          description: Operazione non valida
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

  /protocols/{protocolId}/evaluations:
    post:
      summary: Valuta un protocollo
      description: L'EC (Ethical Committee) valuta il protocollo
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Evaluation"
      responses:
        "201":
          description: Valutazione registrata
          content:
            application/json:
              schema:
                # $ref: "#/components/schemas/Evaluation"
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Dati non validi
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

    get:
      summary: Recupera le valutazioni di un protocollo
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista delle valutazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evaluation"
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

  /hospitals:
    get:
      summary: Recupera la lista degli ospedali
      description: Recupera tutti gli ospedali nel consorzio
      responses:
        "200":
          description: Lista degli ospedali
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hospital"
        "401":
          description: Non autorizzato

  /protocols/{protocolId}/invitations:
    post:
      summary: Crea inviti per un protocollo
      description: Il CRD (Clinical Research Group) invia inviti agli ospedali collaboratori
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hospitalIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                responseDeadline:
                  type: string
                  format: date-time
              required:
                - hospitalIds
      responses:
        "201":
          description: Inviti creati
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                  - id
        "400":
          description: Dati non validi
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

    get:
      summary: Recupera gli inviti per un protocollo
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [SENT, ACCEPTED, REJECTED, MODIFICATIONS_REQUESTED]
      responses:
        "200":
          description: Lista degli inviti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "404":
          description: Protocollo non trovato
        "401":
          description: Non autorizzato

  # # ! dal punto di vista del collaborator
  # /invitations/{invitationId}/respond:
  #   post:
  #     summary: Risponde a un invito
  #     description: L'ospedale collaboratore risponde all'invito
  #     parameters:
  #       - name: invitationId
